
name: Build C++ Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Compile C++ to EXE
        shell: msys2 {0}
        run: |
          set -e
          shopt -s nullglob
          sources=( *.cpp )
          if [ ${#sources[@]} -eq 0 ]; then
            echo "ERROR: Tidak ada file .cpp di folder utama repository."
            exit 1
          fi
          g++ -std=c++17 -O2 -static-libgcc -static-libstdc++ "${sources[@]}" -o aplikasi-windows.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-windows
          path: aplikasi-windows.exe
          if-no-files-found: error
          retention-days: 7
